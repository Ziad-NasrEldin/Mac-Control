<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="0.55" stop-color="#6D4BFA"/>
      <stop offset="1" stop-color="#A23CF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B0F4D" flood-opacity="0.35"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2A1170" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body with a continuous-corner rounded square -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>
  <!-- ⌘ built from a square and four tangent loops; its center holds a voice waveform -->
  <g transform="translate(512 512) scale(0.8) translate(-512 -512)">
  <g filter="url(#glyphShadow)" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round">
    <circle cx="282" cy="282" r="80"/>
    <circle cx="742" cy="282" r="80"/>
    <circle cx="282" cy="742" r="80"/>
    <circle cx="742" cy="742" r="80"/>
    <line x1="282" y1="362" x2="742" y2="362"/>
    <line x1="282" y1="662" x2="742" y2="662"/>
    <line x1="362" y1="282" x2="362" y2="742"/>
    <line x1="662" y1="282" x2="662" y2="742"/>
  </g>
  <g filter="url(#glyphShadow)">
    <rect x="414" y="477" width="28" height="70" rx="14" fill="#FFFFFF"/>
    <rect x="456" y="442" width="28" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="498" y="417" width="28" height="190" rx="14" fill="#FFE27A"/>
    <rect x="540" y="442" width="28" height="140" rx="14" fill="#FFFFFF"/>
    <rect x="582" y="477" width="28" height="70" rx="14" fill="#FFFFFF"/>
  </g>
  </g>
</svg>
